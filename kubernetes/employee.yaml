apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee
  template:
    metadata:
      labels:
        app: employee
    spec:
      containers:
        - name: employee
          image: employee
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: MONGO_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: MONGO_URL
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: MONGO_DB
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: REDIS_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: JWT_SECRET_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: employee
spec:
  type: LoadBalancer
  selector:
    app: employee
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
